services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dataplatform

  airflow-webserver:
    image: apache/airflow:3.1.5
    command: >
      bash -c "
      airflow db reset -y &&
      airflow db migrate &&
      airflow api-server
      "
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../spark-apps:/opt/spark-apps
    ports:
      - "8081:8080"
    networks:
      - dataplatform

  airflow-scheduler:
    image: apache/airflow
    command: >
      bash -c "
      airflow db migrate &&
      airflow scheduler
      "    
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../spark-apps:/opt/spark-apps
    networks:
      - dataplatform

  airflow-init:
    image: apache/airflow
    depends_on:
      - postgres
    environment:
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      # AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    entrypoint: >
      bash -c "
      airflow db reset -y &&
      airflow users create \
        --username ${AIRFLOW_USERNAME} \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@example.com \
        --password ${AIRFLOW_PASSWORD}
      "
    networks:
      - dataplatform

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.2
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - dataplatform
      
  kafka:
    image: confluentinc/cp-kafka:7.2.2
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - dataplatform
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.2.2
    depends_on:
      kafka: 
        condition: service_healthy
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic events --partitions 2 --replication-factor 1
      "
    networks:
      - dataplatform

  producer-1:
    build:
      dockerfile: ./docker/producer/Dockerfile
      context: ..
    depends_on:
      - kafka
      - kafka-init
    networks:
      - dataplatform

  producer-2:
    build: 
      dockerfile: ./docker/producer/Dockerfile
      context: ..
    depends_on:
      - kafka
      - kafka-init
    networks:
      - dataplatform

  kafka-consumer-1:
    image: confluentinc/cp-kafka:7.2.2
    depends_on:
      - kafka
    command: >
      bash -c "
      sleep 15 &&
      kafka-console-consumer --bootstrap-server kafka:9092 --topic events --group spark-group
      "
    networks:
      - dataplatform

  kafka-consumer-2:
    image: confluentinc/cp-kafka:7.2.2
    depends_on:
      - kafka
    command: >
      bash -c "
      sleep 15 &&
      kafka-console-consumer --bootstrap-server kafka:9092 --topic events --group spark-group
      "
    networks:
      - dataplatform

  spark-master:
    image: apache/spark
    container_name: spark-master
    volumes:
      - ../spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - dataplatform
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy

  spark-worker-1:
    image: apache/spark
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - dataplatform

  spark-worker-2:
    image: apache/spark
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - dataplatform

  minio1:
    image: minio/minio
    command: server http://minio{1...2}/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data1a:/data1
      - minio_data1b:/data2
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dataplatform
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 10

  minio2:
    image: minio/minio
    command: server http://minio{1...2}/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data2a:/data1
      - minio_data2b:/data2
    networks:
      - dataplatform
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio1:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 15;
      mc alias set local http://minio1:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --with-lock --with-versioning local/bronze;
      mc mb --with-versioning local/silver;
      mc mb --with-versioning local/gold;
      "
    networks:
      - dataplatform

  # minio-init:
  #   build: 
  #     dockerfile: ./buckets/Dockerfile
  #     context: .
  #   depends_on:
  #     - kafka
  #   networks:
  #     - dataplatform

volumes:
  postgres_data:
  minio_data1a:
  minio_data1b:
  minio_data2a:
  minio_data2b:

networks:
  dataplatform:
