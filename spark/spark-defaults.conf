# Conecttion settings 
spark.hadoop.fs.s3a.endpoint=http://minio1:9000
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}

# retry settings
spark.hadoop.fs.s3a.retry.limit=10
spark.hadoop.fs.s3a.attempts.maximum=10
spark.hadoop.fs.s3a.retry.interval=1s
spark.hadoop.fs.s3a.connection.timeout=5000
spark.hadoop.fs.s3a.connection.establish.timeout=5000
spark.hadoop.fs.s3a.connection.maximum=100

# Upload settings
spark.hadoop.fs.s3a.multipart.size=64M
spark.hadoop.fs.s3a.multipart.threshold=64M
spark.hadoop.fs.s3a.fast.upload=true

# Ssl
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.list.version=2
